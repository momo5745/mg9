<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-title" content="MG9">

<title>MG9</title>

<style>
/* VOICE: appli de sport perso, directe, gros chiffres, peu de mots.
   IDEA: l'écran d'accueil d'une appli de training : séance du jour, anneaux, compteurs.
   PICTURE: grande carte « séance du jour » sur une photo de match, anneaux d'activité.
   COLOUR and TYPE: noir profond, vert vif pour la progression, violet PSC en second ; Barlow Condensed + Barlow.
   LAYOUT: barre du haut compacte, cartes pleine largeur, tuiles en 2 colonnes, pages qui glissent, onglets flottants. */
:root{color-scheme:dark;--bg:#0a0e0c;--card:#141a17;--card2:#1e2722;--ink:#f2f6f3;--mute:#8f9c94;--line:#26312b;--acc:#34d27f;--acc2:#0b3a22;--accink:#03140a;--p:#b49cff;--pf:#6f3fb5;--w:#ff8c5f;--g:#0f3d2a;--g2:#34d27f;--gon:#03140a;--pb:#251d3a;--wb:#3a1f14;--gb:#10301f}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
svg{stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(10,14,12,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);flex:none}
.who{flex:1;line-height:1.15}.who b{font-size:17px;display:block}.who span{font-size:13px;color:var(--mute)}
.hb{width:44px;height:44px;border-radius:14px;border:0;background:var(--card2);display:grid;place-items:center;flex:none;padding:0}
.hb svg{width:22px;height:22px}
main{padding:4px 16px calc(120px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.vt{font-size:42px;line-height:1;margin:10px 0 14px;font-weight:800}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 10px}
.sect h2{margin:0;font-size:24px;font-weight:700}
.link{color:var(--acc);font-weight:700;background:none;border:0;font-size:15px;padding:8px 0}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;border:0}
.card.tap{display:block;width:100%;text-align:left;cursor:pointer}
.card .kv:first-child{border-top:0}
body.home .top .av,body.home .top .who{visibility:hidden}
.me{display:grid;grid-template-columns:44% minmax(0,1fr);gap:16px;align-items:end;margin:10px 0 18px}
.me img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,.55);display:block}
.mi h1{font-size:34px;line-height:.98;margin:4px 0 4px;font-weight:800}
.ms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}
.ms div{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center}
.ms b{display:block;font:800 28px/1 "Barlow Condensed",sans-serif;color:var(--acc)}.ms span{font-size:12px;color:var(--mute)}
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:310px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,rgba(10,14,12,0) 0%,rgba(10,14,12,.5) 42%,rgba(10,14,12,.96) 100%),url(hero.jpg) center 22%/cover,var(--acc2)}
.kick{color:var(--acc);font-weight:700;font-size:14px}
.hero h1{margin:4px 0;font-size:40px;line-height:1.02;font-weight:800;text-wrap:balance}
.hero p{margin:0 0 14px;color:#cfd8d2}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:0;border-radius:18px;background:var(--acc);color:var(--accink);font:800 21px "Barlow Condensed",sans-serif}
.cta svg{width:20px;height:20px}
.cta.alt{background:rgba(255,255,255,.14);color:#fff}
.donepill{display:inline-flex;align-items:center;gap:8px;background:var(--gb);color:var(--acc);border-radius:999px;padding:8px 14px;font-weight:700;align-self:flex-start;margin-top:6px}
.donepill svg{width:18px;height:18px}
.next{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-top:10px;width:100%;border:0;text-align:left}
.next b{font:800 30px/1 "Barlow Condensed",sans-serif;color:var(--acc);white-space:nowrap}
.next span{flex:1;font-weight:600;line-height:1.25}
.next small{display:block;color:var(--mute);font-weight:500;font-size:13px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.rings.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.ring{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--mute)}
.ring .in{position:relative;width:92px;height:92px}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:var(--card2)}
.ring .fg{transition:stroke-dashoffset .8s cubic-bezier(.3,.9,.3,1)}
.ring .in b{position:absolute;inset:0;display:grid;place-items:center;font:800 26px "Barlow Condensed",sans-serif;color:var(--ink)}
.prs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:16px}
.pb{border:0;background:var(--card2);border-radius:16px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--mute)}
.pb i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.pb i svg{width:16px;height:16px}
.pb.on{color:var(--ink)}.pb.on i{background:var(--acc);border-color:var(--acc);color:var(--accink);animation:pop .28s}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{border:0;background:var(--card);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px;justify-content:space-between}
.tile .tl{color:var(--mute);font-weight:600;font-size:14px}
.tile b{font:800 40px/1 "Barlow Condensed",sans-serif;overflow-wrap:break-word}
.tile .ts{font-size:14px;color:var(--mute);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile.acc{background:var(--acc);color:var(--accink)}.tile.acc .tl,.tile.acc .ts{color:#0b4a2a}
.tile.pur{background:var(--pf);color:#fff}.tile.pur .tl,.tile.pur .ts{color:#e3d9ff}
.tile.warn b{color:var(--w)}
.tile.done{background:var(--gb)}.tile.done .ts{color:var(--acc);font-weight:700}
.lr{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%}
.list .lr+.lr{border-top:1px solid var(--line)}
.lm{flex:1}.lt{font-weight:600;font-size:16px;line-height:1.25}.ls{font-size:14px;color:var(--mute);line-height:1.3}
.lr.tap{cursor:pointer}
.chev{width:20px;height:20px;color:var(--mute);flex:none}
.ini{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 17px "Barlow Condensed",sans-serif;flex:none;background:var(--card2);color:var(--ink)}
.ini.t{font-size:14px}
.ini.hot{background:var(--gb);color:var(--acc)}.ini.cold{background:var(--wb);color:var(--w)}.ini.late{background:var(--w);color:#1a0a03}
.rc{width:34px;height:34px;border-radius:50%;border:2px solid #3a463f;background:transparent;display:grid;place-items:center;flex:none;padding:0;color:transparent}
.rc svg{width:18px;height:18px}
.rc.on{background:var(--acc);border-color:var(--acc);color:var(--accink);animation:pop .28s}
.lr.done .lt{text-decoration:line-through;color:var(--mute)}
.tag{display:inline-block;font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mute);white-space:nowrap}
.tag.w{background:var(--wb);color:var(--w)}.tag.g{background:var(--gb);color:var(--acc)}
.mute{color:var(--mute);font-size:14px}
.empty{color:var(--mute);padding:6px 0}
.btn{border:0;background:var(--card2);color:var(--ink);font-weight:700;font-size:15px;border-radius:14px;padding:10px 16px;min-height:48px}
.btn.acc,.panel button[type=submit]{background:var(--acc);color:var(--accink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .btn{flex:1 1 auto}
.tile.q b{font-size:25px;line-height:1.05;overflow-wrap:normal}.tile.q .ts{color:var(--acc);font-weight:700}
.hadith p{font-size:17px;line-height:1.5;margin:8px 0}
.why summary{color:var(--p);font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;list-style:none}.why summary::-webkit-details-marker{display:none}.why p{margin:6px 0 4px;font-size:14px;line-height:1.45}.why span{font-size:12px;color:var(--mute)}
.hd{font-size:15px;line-height:1.45;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;text-align:left}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:120px;margin-top:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:13px;color:var(--mute);font-weight:700}
.wd .bars{width:100%;max-width:30px;flex:1;background:var(--card2);border-radius:9px;display:flex;align-items:flex-end;overflow:hidden}
.wd .bars i{display:block;width:100%;background:var(--p);border-radius:9px;transition:height .6s}
.wd.full .bars i{background:var(--acc)}
.wd.today{color:var(--ink)}
.wd em{width:8px;height:8px;border-radius:50%;background:var(--card2)}.wd em.on{background:var(--acc)}
.bigrow{display:flex;align-items:baseline;gap:10px}
.bigrow b{font:800 58px/1 "Barlow Condensed",sans-serif}
.seg{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none;padding-bottom:2px}.seg::-webkit-scrollbar{display:none}.seg.wrap{flex-wrap:wrap;overflow:visible}
.seg button{flex:none;border:0;background:var(--card2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;min-height:40px}
.seg button.on{background:var(--ink);color:var(--bg)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.strip button{border:0;background:var(--card);border-radius:16px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 20px/1 "Barlow Condensed",sans-serif}
.strip button span{font:600 11px Barlow,sans-serif;color:var(--mute)}
.strip button.today{background:var(--ink);color:var(--bg)}.strip button.today span{color:#4b5650}
.strip button em{width:7px;height:7px;border-radius:50%;background:transparent}.strip button em.on{background:var(--acc)}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3 div{background:var(--card2);border-radius:14px;padding:12px 10px}
.stat3 b{display:block;font:800 34px/1 "Barlow Condensed",sans-serif}.stat3 span{font-size:13px;color:var(--mute)}
.stat3 .w b{color:var(--w)}.stat3 .g b{color:var(--acc)}
.ex{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.ex a{color:var(--p);font-weight:700;white-space:nowrap;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;text-align:center;border-top:1px solid var(--line)}th{color:var(--mute);font-weight:600}td:first-child,th:first-child{text-align:left}
.dot{width:12px;height:12px;border-radius:50%;background:var(--card2);display:inline-block}.dot.on{background:var(--acc)}
.iconb{font-size:24px;line-height:1;width:46px;height:46px;border-radius:14px;border:0;background:var(--card2);display:grid;place-items:center;flex:none;padding:0}
.iconb svg{width:22px;height:22px}
.thumb{width:48px;height:48px;border-radius:14px;object-fit:cover;flex:none}
.note{background:var(--card2);border-radius:14px;padding:12px;font-size:14px;margin:8px 0 12px}.note.w{background:var(--wb)}
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));background:rgba(30,39,34,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:35;padding:6px;max-width:560px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
nav.tabs button{background:none;border:0;color:var(--mute);font-weight:600;font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:18px;min-height:52px}
nav.tabs button.on{color:var(--ink);background:rgba(255,255,255,.08)}
nav.tabs button.on svg{color:var(--acc)}
nav svg{width:24px;height:24px}
.page{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.page.open{display:flex}
.page.slide{animation:sl .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateX(35%);opacity:.3}}
.ph{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.ph h2{flex:1;margin:0;font-size:24px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{flex:1;overflow:auto;padding:8px 16px calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.pc>*{max-width:680px;margin-left:auto;margin-right:auto}
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 0 14px}
.prof .ini{width:88px;height:88px;font-size:34px}
.prof h1{margin:4px 0 0;font-size:34px;line-height:1.05}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.kv span{color:var(--mute)}.kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center;z-index:60}.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.panel h2{margin:0 0 14px;font-size:28px}
.f{display:block;margin:0 0 12px;font-weight:600;font-size:14px;color:var(--mute)}
.f.ck{display:flex;gap:10px;align-items:center;font-size:16px;color:var(--ink)}.f.ck input{width:24px;height:24px;min-height:0;margin:0;accent-color:var(--acc)}
input,select,textarea{width:100%;font:16px Barlow,sans-serif;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:6px;min-height:48px}
textarea{min-height:100px;resize:vertical}
input[type=search]{background:var(--card);border:0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.composer{position:fixed;left:10px;right:10px;bottom:calc(78px + env(safe-area-inset-bottom));background:var(--card);border-radius:20px;padding:8px;display:none;gap:8px;align-items:flex-end;z-index:34;max-width:560px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.composer.show{display:flex}
.composer textarea{min-height:46px;max-height:140px;margin:0;flex:1;border:0;background:var(--card2)}
.iconb.send{background:var(--acc);color:var(--accink)}
.msg{max-width:88%;padding:11px 14px;border-radius:20px;margin:0 0 10px;overflow-wrap:anywhere}
.msg.user{margin-left:auto;background:var(--pf);color:#fff;border-bottom-right-radius:6px}
.msg.assistant{background:var(--card);border-bottom-left-radius:6px}
.pend{font-size:13px;color:var(--p);margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:16px;display:none;gap:12px;z-index:80;align-items:center;max-width:92vw;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast .btn{background:var(--bg);color:var(--ink);min-height:36px}
button:active,.tap:active{transform:scale(.96)}
button,.tap{transition:transform .12s}
.chk.on{animation:pop .28s}
@keyframes pop{50%{transform:scale(1.25)}}
#view.anim>*{animation:fu .32s both}
#view.anim>*:nth-child(2){animation-delay:.04s}#view.anim>*:nth-child(3){animation-delay:.08s}#view.anim>*:nth-child(4){animation-delay:.12s}#view.anim>*:nth-child(5){animation-delay:.16s}
@keyframes fu{from{opacity:0;transform:translateY(14px)}}
.burst{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:90;animation:bst .7s ease-out forwards}
@keyframes bst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
/* lecteur plein écran (séance, adhkar) */
.player{position:fixed;inset:0;z-index:70;background:radial-gradient(120% 70% at 50% 0%,#17462f 0%,#0a0e0c 75%);color:#fff;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px);overflow:auto}
.player.open{display:flex;animation:fu .25s}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ptop h3{margin:0;font-size:22px}
.pclose{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;flex:none}
.dots{display:flex;gap:4px;margin:12px 0}
.dots i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.22)}
.dots i.on{background:#fff}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.pbody h2{font-size:34px;line-height:1.08;margin:0}
.pbody .sub{opacity:.8;font-size:16px}
.ar{font-family:Amiri,serif;font-size:25px;line-height:1.9;direction:rtl;text-align:center}
.tr{font-style:italic;opacity:.9;font-size:15px}
.fr{font-size:15px;opacity:.95}
.src{font-size:13px;opacity:.7}
.counter{width:150px;height:150px;border-radius:50%;border:0;margin:4px auto 0;background:rgba(255,255,255,.12);color:#fff;position:relative;flex:none}
.counter svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.counter circle{fill:none;stroke-width:7}
.counter b{font:800 46px/1 "Barlow Condensed",sans-serif;display:block}
.counter span{font-size:13px;opacity:.8}
.pbtns{display:flex;gap:8px;margin-top:8px}
.pbtns .btn{flex:1;min-height:54px;font-size:17px}
.btn.white{background:#fff;color:var(--g)}
.btn.line{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff}
.timer b{font:800 72px/1 "Barlow Condensed",sans-serif}
.rests{display:flex;gap:6px;justify-content:center}
.rests button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;min-height:36px}
.rests button.on{background:#fff;color:var(--g)}
.player a{color:#fff;font-weight:600}
@media (prefers-reduced-motion:reduce){#view.anim>*,.player.open,.chk.on{animation:none}.burst{display:none}}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.5}}}
@media (min-width:700px){header{padding-left:max(18px,calc(50vw - 346px))}}
</style>
</head>
<body>
<header class="top"><img class="av" src="me.jpg" alt=""><div class="who"><b>Mohamed</b><span id="hdate"></span></div><button class="hb" data-act="settings" aria-label="Réglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button></header>
<main id="view"></main>
<div class="composer" id="composer">
  <button class="iconb" id="attach" aria-label="Ajouter une photo"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></button>
  <div style="flex:1"><div class="pend" id="pend" hidden></div><textarea id="cin" rows="1" placeholder="Pose ta question…"></textarea></div>
  <button class="iconb send" id="send" aria-label="Envoyer"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="page" id="page"></div>
<div class="sheet" id="sheet"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="player" id="player" role="dialog" aria-modal="true"></div>
<input type="file" id="fmeal" accept="image/*" hidden>
<input type="file" id="fchat" accept="image/*" hidden>
<input type="file" id="fimp" accept="application/json,.json" hidden>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)};
const dowOf=s=>new Date(s+'T12:00:00').getDay();
const fmtD=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}):'';
const fmtLong=s=>new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>Number(v)||0;
const PR=[['fajr','Fajr'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']];
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DMAP={Dim:0,Lun:1,Mar:2,Mer:3,Jeu:4,Ven:5,Sam:6};
const DFULL={Lun:'Lundi',Mar:'Mardi',Mer:'Mercredi',Jeu:'Jeudi',Ven:'Vendredi',Sam:'Samedi',Dim:'Dimanche'};
const ST=['À contacter','Message envoyé','En discussion','Piste chaude','Sans réponse','Terminé'];
const CH=['WhatsApp','Instagram','Email','Téléphone','SMS','Facebook','En personne'];
const SCH={
habit:{t:'Petit objectif',f:[['title','Objectif de chaque jour','text',0,1]]},
contact:{t:'Contact',f:[['name','Nom','text',0,1],['org','Club / agence','text'],['role','Rôle','text'],['country','Pays','text'],['channel','Canal','select',CH],['handle','Numéro / compte / email','text'],['status','Statut','select',ST,1],['last','Dernier contact','date'],['next','Relancer le','date'],['notes','Notes','textarea']]},
goal:{t:'Objectif',f:[['title','Objectif','text',0,1],['cat','Catégorie','select',['Foot','Carrière','Physique','École','Religion'],1],['deadline','Pour quand','date'],['cur','Où j\'en suis (chiffre, optionnel)','number'],['target','Cible (chiffre, optionnel)','number'],['notes','Notes','textarea'],['done','Atteint','check']]},
match:{t:'Match',f:[['date','Date','date',0,1],['opp','Adversaire','text',0,1],['comp','Compétition','text'],['starter','Titulaire','check'],['min','Minutes jouées','number'],['goals','Buts','number'],['assists','Passes décisives','number'],['rating','Ma note sur 10','number'],['notes','Bien fait / à travailler','textarea']]},
season:{t:'Bilan de saison',f:[['title','Saison','text',0,1],['games','Matchs','number'],['starts','Titularisations','number'],['goals','Buts','number'],['assists','Passes décisives','number'],['notes','Notes','textarea']]},
session:{t:'Séance',f:[['day','Jour','select',DAYS,1],['title','Séance','text',0,1],['type','Type','select',['Salle','Terrain','Mobilité','Repos'],1],['ex','Exercices (un par ligne : exercice — séries)','textarea'],['notes','Notes','textarea']]},
hw:{t:'Devoir',f:[['course','Cours','course',0,1],['title','Devoir','text',0,1],['due','À rendre le','date'],['notes','Notes','textarea'],['done','Fait','check']]},
weekly:{t:'Créneau de la semaine',f:[['title','Quoi (cours, entraînement, boulot…)','text',0,1],['days','Jours','days',0,1],['start','Début','time'],['end','Fin','time'],['place','Lieu','text']]},
event:{t:'Événement',f:[['title','Quoi','text',0,1],['date','Date','date',0,1],['end','Jusqu\'au (optionnel)','date'],['time','Heure','time'],['place','Lieu','text'],['notes','Notes','textarea']]},
bac:{t:'Démarche bac+3',f:[['title','Démarche','text',0,1],['due','Pour quand','date'],['notes','Notes','textarea'],['done','Fait','check']]},
hifz:{t:'Sourate',f:[['title','Sourate','text',0,1],['total','Nombre de versets','number'],['learned','Versets mémorisés','number'],['notes','Notes','textarea']]},
meal:{t:'Repas',f:[['date','Date','date',0,1],['name','Repas','text',0,1],['protein','Protéines (g)','number'],['kcal','Calories (kcal)','number'],['notes','Notes','textarea']]}
};
const LSK='mg9-data-v1';
const S={items:[],days:{},profile:{},chat:[],tab:'home',seg:{foot:'obj',ecole:'hw',vie:'rel'},cf:'all',cq:'',hwc:'Tous',db:null,ai:null,aiImg:false,assets:null,loaded:false,slow:false,nodb:false,busy:false,pendImg:null,anim:true,pg:null,stack:[],pgNew:false};
const items=k=>S.items.filter(i=>i.kind===k);
const prof=()=>({about:'',courses:['Math 151','ENG 101','Windows 11','Art'],protein:140,water:8,...S.profile});
const weekStart=s=>addDays(s,-((dowOf(s)+6)%7));
const dayOf=d=>S.days[d]||{};
const inEv=(e,d)=>e.date&&e.date<=d&&d<=(e.end||e.date);

/* ---------- stockage ---------- */
let tt;
function toast(m,undo){const t=$('#toast');t.innerHTML='<span>'+esc(m)+'</span>'+(undo?'<button class="btn sm" id="undo">Annuler</button>':'');t.style.display='flex';if(undo)$('#undo').onclick=()=>{t.style.display='none';undo()};clearTimeout(tt);tt=setTimeout(()=>{t.style.display='none'},undo?6000:2600)}
function errMsg(e){const c=e&&e.code;return c==='quota_exceeded'?'Stockage plein : supprime des éléments':c==='revoked'?'Accès à la sauvegarde retiré':c==='invalid_argument'?'Enregistrement refusé':'Pas de connexion : réessaie'}
const pend={},busyW={};
let pT=0;function persist(){clearTimeout(pT);pT=setTimeout(()=>{try{localStorage.setItem(LSK,JSON.stringify({v:1,items:S.items,days:S.days,profile:S.profile,bilan:S.bilan||null}))}catch(e){toast('Mémoire pleine : exporte ta sauvegarde puis supprime des photos de repas')}},150)}
function writeDoc(path,data){if(path==='meta/bilan')S.bilan=data;if(path==='meta/chat')return;persist()}
function saveItem(o){const id=o.id||uid();const body={...o};delete body.id;body.updated=Date.now();const i=S.items.findIndex(x=>x.id===id);if(i>=0)S.items[i]={...body,id};else S.items.push({...body,id});render();writeDoc('items/'+id,body)}
async function delItem(id){const o=S.items.find(x=>x.id===id);if(!o)return;S.items=S.items.filter(x=>x.id!==id);render();persist();toast('Supprimé',()=>saveItem(o))}
function setDay(d,patch){S.days[d]={...dayOf(d),...patch};render();writeDoc('days/'+d,S.days[d])}
function saveProfile(p){S.profile={...prof(),...p};render();writeDoc('meta/profile',S.profile)}

/* ---------- petits morceaux d'interface ---------- */
const chk=(on,act,id,x)=>`<button class="chk${on?' on':''}" data-act="${act}" data-id="${esc(id||'')}" data-x="${esc(x||'')}" aria-label="${on?'Fait':'À faire'}"></button>`;
const addBtn=(k,lab)=>`<button class="btn sm ghost" data-act="add" data-x="${k}">+ ${lab||'Ajouter'}</button>`;
const segs=(tab,list)=>`<div class="seg">${list.map(([k,l])=>`<button class="${S.seg[tab]===k?'on':''}" data-act="seg" data-x="${tab}:${k}">${l}</button>`).join('')}</div>`;
const bar=(v,max)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,max?v/max*100:0))}%"></i></div>`;
const empty=t=>`<div class="empty">${t}</div>`;
function dueTag(d){if(!d)return'';const t=today();if(d<t)return'<span class="tag w">En retard · '+fmtD(d)+'</span>';if(d===t)return'<span class="tag w">Aujourd\'hui</span>';if(d===addDays(t,1))return'<span class="tag">Demain</span>';return'<span class="tag">'+fmtD(d)+'</span>'}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-•*]\s+/gm,'• ').replace(/\n/g,'<br>')}

/* ---------- VUES (v3 : style appli sport) ---------- */
const I={play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/></svg>',chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
const ini=n=>String(n||'?').replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const sect=(t,r)=>`<div class="sect"><h2>${t}</h2>${r||''}</div>`;
const more=n=>`<button class="link" data-act="pg" data-x="${n}">Tout voir</button>`;
const rc=(on,act,id,x)=>`<button class="rc${on?' on':''}" data-act="${act}" data-id="${esc(id||'')}" data-x="${esc(x||'')}" aria-label="${on?'Fait':'À faire'}">${I.check}</button>`;
const lr=(lead,t,s,end,tap,cls)=>`<div class="lr${tap?' tap':''}${cls?' '+cls:''}"${tap?` data-act="${tap[0]}" data-x="${esc(tap[1]||'')}" data-id="${esc(tap[2]||'')}"`:''}>${lead||''}<div class="lm"><div class="lt">${t}</div>${s?`<div class="ls">${s}</div>`:''}</div>${end||''}</div>`;
const tile=(act,x,id,label,big,sub,cls)=>`<button class="tile ${cls||''}" data-act="${act}" data-x="${esc(x||'')}" data-id="${esc(id||'')}"><span class="tl">${label}</span><b>${big}</b>${sub?`<span class="ts">${sub}</span>`:''}</button>`;
const isLate=c=>!!(c.next&&c.next<=today()&&c.status!=='Terminé');
const cIni=c=>`<span class="ini ${isLate(c)?'late':c.status==='Piste chaude'?'hot':c.status==='Sans réponse'?'cold':''}">${esc(ini(c.name))}</span>`;
const prayBtns=t=>{const day=dayOf(t);return`<div class="prs">${PR.map(([k,l])=>{const on=(day.prayers||{})[k];return`<button class="pb${on?' on':''}" data-act="pr" data-x="${t}|${k}"><i>${on?I.check:''}</i>${l}</button>`}).join('')}</div>`};
const adhTiles=t=>{const d=dayOf(t);return tile('adhkar','M','','Adhkar','Matin',d.adhM?'Fait aujourd\'hui':'Lire et compter',d.adhM?'done':'')+tile('adhkar','S','','Adhkar','Soir',d.adhS?'Fait aujourd\'hui':'Lire et compter',d.adhS?'done':'')};

function vHome(){const t=today(),dw=dowOf(t),p=prof(),day=dayOf(t),sd=day.sess||[];
 const all=items('session').filter(s=>DMAP[s.day]===dw),work=all.filter(s=>s.type!=='Repos'),s0=work.find(s=>!sd.includes(s.id));
 const nPr=PR.filter(([k])=>(day.prayers||{})[k]).length,prot=items('meal').filter(m=>m.date===t).reduce((n,m)=>n+num(m.protein),0);
 let hero;
 if(!work.length)hero=`<div class="hero"><span class="kick">Aujourd'hui</span><h1>Jour de repos</h1><p>${esc(all[0]?(all[0].ex||'').split('\n')[0]:'Récupère bien, ça fait partie de l\'entraînement.')}</p><button class="cta alt" data-act="pg" data-x="day" data-id="${DAYS[(dw+6)%7]}">Voir le programme</button></div>`;
 else if(!s0)hero=`<div class="hero"><span class="kick">Séance du jour</span><h1>${esc(work[0].title)}</h1><div class="donepill">${I.check} Séance faite</div></div>`;
 else hero=`<div class="hero"><span class="kick">Séance du jour · ${esc(s0.type)}</span><h1>${esc(s0.title)}</h1><p>${parseEx(s0).length} exercices</p><button class="cta" data-act="play" data-id="${s0.id}">${I.play} Lancer la séance</button></div>`;
 const nx=items('event').filter(e=>e.date>t).sort((a,b)=>a.date.localeCompare(b.date))[0];
 const todo=[];
 items('event').filter(e=>inEv(e,t)).forEach(e=>todo.push(lr(`<span class="ini t">${esc(e.time?e.time.slice(0,5):'Auj.')}</span>`,esc(e.title),esc(e.place||''),I.chev,['edit','',e.id])));
 items('hw').filter(h=>!h.done&&h.due&&h.due<=addDays(t,1)).sort((a,b)=>a.due.localeCompare(b.due)).forEach(h=>todo.push(lr(rc(false,'tog',h.id,'done'),esc(h.title),esc(h.course),dueTag(h.due),['edit','',h.id])));
 items('contact').filter(isLate).forEach(c=>todo.push(lr(cIni(c),'Relancer '+esc(c.name),esc(c.org||c.channel||''),I.chev,['pg','contact',c.id])));
 const ws=weekStart(t),wd=[...Array(7)].map((_,i)=>addDays(ws,i));
 const week=wd.map((d,i)=>{const x=dayOf(d),n=PR.filter(([k])=>(x.prayers||{})[k]).length;return`<div class="wd${d===t?' today':''}${n===5?' full':''}"><div class="bars"><i style="height:${n/5*100}%"></i></div><em class="${(x.sess||[]).length?'on':''}"></em>${DAYS[i].slice(0,1)}</div>`}).join('');
 const st=streak(),bil=S.bilan&&S.bilan.week===ws?S.bilan:null;
 const ss=items('season')[0];
 return `<div class="me"><img src="card.jpg" alt="Mohamed en maillot n°9 de Prairie State"><div class="mi"><span class="kick">N°9 · Ailier</span><h1>Mohamed<br>Ghelaissa</h1><div class="mute">Prairie State Pioneers</div>${ss?`<div class="ms"><div><b>${num(ss.goals)}</b><span>buts</span></div><div><b>${num(ss.assists)}</b><span>passes</span></div><div><b>${num(ss.games)}</b><span>matchs</span></div></div>`:''}</div></div>${hero}
 ${nx?`<button class="next" data-act="pg" data-x="agenda"><b>J-${dBetween(t,nx.date)}</b><span>${esc(nx.title)}<small>${fmtD(nx.date)}</small></span>${I.chev}</button>`:''}
 ${sect('Ma journée')}<div class="card"><div class="rings">${ring('pr','Prières',nPr,5,nPr+'/5','pg','prayers')}${ring('ea','Eau · touche',num(day.water),p.water,num(day.water)+'/'+p.water,'water','1')}${ring('pt','Protéines',prot,p.protein,prot+'g','pg','nutri')}</div>${prayBtns(t)}</div>
 <div class="tiles">${adhTiles(t)}</div>
 ${items('habit').length?sect('Mes petits objectifs',`<button class="link" data-act="tab" data-x="ia">Tout voir</button>`)+`<div class="card list">${habRows(t,4)}</div>`:''}
 ${sect('À faire',todo.length?`<span class="mute">${todo.length}</span>`:'')}<div class="card list">${todo.slice(0,5).join('')||'<div class="empty">Rien d\'urgent aujourd\'hui.</div>'}</div>
 ${sect('Ma semaine')}<div class="card"><div class="bigrow"><b>${st}</b><span class="mute">jour${st>1?'s':''} de suite avec les 5 prières</span></div><div class="week">${week}</div><div class="mute" style="margin-top:10px">Barres : prières · point vert : séance faite</div></div>
 ${(()=>{const hd=hadithDuJour();return hadCard(hd.h,hd.src,'Hadith du jour')})()}
 <div class="card"><div class="kick">Bilan de la semaine</div>${bil?`<div style="margin-top:8px">${md(bil.text)}</div>`:`<p class="mute" style="margin:6px 0 0">3 priorités pour la suite, à partir de ta semaine.</p>`}<div class="acts"><button class="btn ${bil?'':'acc'}" data-act="bilan">Faire mon bilan avec Claude</button></div></div>`}

function vFoot(){const t=today(),dw=dowOf(t),ws=weekStart(t),s=items('season')[0],cs=items('contact'),gs=items('goal');
 const late=cs.filter(isLate).length,open=cs.filter(c=>['Message envoyé','En discussion','Piste chaude'].includes(c.status)).length,hot=cs.filter(c=>c.status==='Piste chaude').length;
 const strip=DAYS.map((d,i)=>{const ss=items('session').filter(x=>x.day===d),ty=ss[0]?ss[0].type:'',done=(dayOf(addDays(ws,i)).sess||[]).length>0;return`<button class="${DMAP[d]===dw?'today':''}" data-act="pg" data-x="day" data-id="${d}">${d.slice(0,1)}<span>${esc(ty?ty.slice(0,4):'—')}</span><em class="${done?'on':''}"></em></button>`}).join('');
 const gd=gs.filter(g=>g.done).length,ms=items('match');
 return `<h1 class="vt">Foot</h1>
 ${s?`<div class="tiles">${tile('pg','matches','','Buts',num(s.goals)+ms.reduce((n,m)=>n+num(m.goals),0),esc(s.title.replace('Saison ',''))+(ms.length?' + matchs ajoutés':''),'acc')}${tile('pg','matches','','Passes décisives',num(s.assists)+ms.reduce((n,m)=>n+num(m.assists),0),num(s.games)+' matchs · '+num(s.starts)+' titu')}</div>`:''}
 ${sect('Agents & clubs',more('contacts'))}
 <button class="card tap" data-act="pg" data-x="contacts"><div class="stat3"><div class="${late?'w':''}"><b>${late}</b><span>à relancer</span></div><div><b>${open}</b><span>en cours</span></div><div class="g"><b>${hot}</b><span>pistes chaudes</span></div></div></button>
 ${sect('Programme')}<div class="strip">${strip}</div>
 ${sect('Objectifs',more('goals'))}<div class="card"><div class="bigrow"><b>${gd}/${gs.length}</b><span class="mute">atteints</span></div>${bar(gd,gs.length)}<div class="list" style="margin-top:6px">${gs.filter(g=>!g.done&&(g.cat==='Foot'||g.cat==='Carrière')).slice(0,3).map(g=>lr(rc(false,'tog',g.id,'done'),esc(g.title),'','',['edit','',g.id])).join('')}</div></div>
 <div class="acts"><button class="btn acc" data-act="add" data-x="match">+ Ajouter un match</button></div>`}

function vEcole(){const t=today(),p=prof(),hs=items('hw').filter(h=>!h.done),late=hs.filter(h=>h.due&&h.due<t).length;
 const nx=hs.slice().sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,4);
 const ev=items('event').filter(e=>(e.end||e.date)>=t).sort((a,b)=>a.date.localeCompare(b.date))[0];
 const bs=items('bac'),bd=bs.filter(b=>b.done).length,wk=items('weekly').length;
 return `<h1 class="vt">École</h1>
 <div class="tiles">${tile('pg','hw','','Devoirs à faire',hs.length,'Tout voir','pur')}${tile('pg','hw','','En retard',late,late?'À rattraper vite':'Rien en retard',late?'warn':'')}</div>
 ${sect('Prochains devoirs')}<div class="card list">${nx.map(h=>lr(rc(false,'tog',h.id,'done'),esc(h.title),esc(h.course),h.due?dueTag(h.due):'',['edit','',h.id])).join('')||'<div class="empty">Aucun devoir en attente.</div>'}</div>
 <div class="acts"><button class="btn acc" data-act="add" data-x="hw">+ Ajouter un devoir</button></div>
 ${sect('Organisation')}<div class="tiles">${tile('pg','edt','','Emploi du temps',wk,wk?'créneaux par semaine':'À remplir')}${tile('pg','agenda','','Agenda',ev?(ev.date<=t?'Auj.':'J-'+dBetween(t,ev.date)):'—',ev?esc(ev.title):'Rien de prévu')}${tile('pg','bac','','Bac+3 France',bd+'/'+bs.length,'démarches faites')}${tile('settings','','','Mes cours',p.courses.length,esc(p.courses.join(' · ')))}</div>`}

function vVie(){const t=today(),p=prof(),day=dayOf(t),last=[...Array(7)].map((_,i)=>addDays(t,i-6));
 const ms=items('meal').filter(m=>m.date===t),prot=ms.reduce((n,m)=>n+num(m.protein),0),hs=items('hifz'),L=hs.reduce((n,h)=>n+num(h.learned),0);
 return `<h1 class="vt">Vie</h1>
 ${sect('Prières')}<div class="card">${prayBtns(t).replace('class="prs"','class="prs" style="margin-top:0"')}
 <table style="margin-top:14px"><tr><th></th>${last.map(d=>`<th>${DAYS[(dowOf(d)+6)%7].slice(0,1)}</th>`).join('')}</tr>${PR.map(([k,l])=>`<tr><td>${l}</td>${last.map(d=>`<td><span class="dot${(dayOf(d).prayers||{})[k]?' on':''}"></span></td>`).join('')}</tr>`).join('')}</table></div>
 <div class="tiles">${adhTiles(t)}${tile('pg','hifz','','Hifz',L,'versets mémorisés','pur')}${tile('pg','hifz','','Sourates',hs.length,hs.length?'en cours':'Ajoute ta sourate')}</div>

async function mealPhoto(file){toast('Analyse de la photo…');const blob=await shrink(file);let o={kind:'meal',date:today()};
 try{const r=await S.ai('Analyse cette photo de repas pour un footballeur de 75 kg. Réponds UNIQUEMENT avec un objet JSON, sans texte autour : {"name":"nom court du repas en français","protein":grammes de protéines estimés (nombre),"kcal":calories estimées (nombre),"notes":"aliments vus, en une phrase courte"}',{images:[blob],cache:false});const m=(r.text||'').match(/\{[\s\S]*\}/);if(m){const j=JSON.parse(m[0]);o={...o,name:String(j.name||''),protein:Math.round(num(j.protein))||'',kcal:Math.round(num(j.kcal))||'',notes:(j.notes?String(j.notes)+' ':'')+'(estimation IA)'}}}catch(e){toast('Analyse impossible : remplis à la main')}
 if(S.assets){try{const a=await S.assets.upload(blob);o.photo=a.id}catch(e){}}
 openForm('meal',o)}

/* ---------- effets ---------- */
const RP={};
function ring(k,l,v,max,txt,act,x){const r=30,C=2*Math.PI*r,f=Math.max(0,Math.min(1,max?v/max:0)),off=C*(1-f),prev=RP[k]??C;RP[k]=off;const full=f>=1;
 return`<button class="ring${full?' full':''}" ${act?`data-act="${act}"`:''} data-x="${esc(x)}"><span class="in"><svg viewBox="0 0 68 68"><circle class="bg" cx="34" cy="34" r="${r}"/><circle class="fg" cx="34" cy="34" r="${r}" stroke="${full?'var(--acc)':'var(--p)'}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${prev.toFixed(1)}" data-off="${off.toFixed(1)}"/></svg><b>${esc(txt)}</b></span>${esc(l)}</button>`}
function animRings(){const cs=document.querySelectorAll('.fg[data-off]');requestAnimationFrame(()=>requestAnimationFrame(()=>cs.forEach(c=>{c.style.strokeDashoffset=c.dataset.off})))}
const RM=matchMedia('(prefers-reduced-motion: reduce)');
function burst(r){if(!r||RM.matches)return;const cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#45b37a','#6f3fb5','#c3a2ee','#ffd166','#ffffff'];for(let i=0;i<16;i++){const s=document.createElement('span');s.className='burst';const a=Math.PI*2*i/16,d=36+Math.random()*44;s.style.left=cx+'px';s.style.top=cy+'px';s.style.background=cols[i%5];s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(0)+'px');s.style.setProperty('--dy',(Math.sin(a)*d).toFixed(0)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),750)}}
const center=()=>({left:innerWidth/2-20,top:innerHeight/2-20,width:40,height:40});
const allPr=d=>PR.every(([k])=>(dayOf(d).prayers||{})[k]);
function streak(){let n=0,d=today();if(!allPr(d))d=addDays(d,-1);while(n<400&&allPr(d)){n++;d=addDays(d,-1)}return n}
const dBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
let AC;function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.18;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.3)}catch(e){}}
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}

const ADH_H={
'Âyat al-Kursî':"Ubayy ibn Ka'b surprit un djinn qui prenait de ses dattes. Le djinn lui dit : « Celui qui la récite le soir est protégé de nous jusqu'au matin, et celui qui la récite le matin est protégé de nous jusqu'au soir. » Le Prophète ﷺ dit ensuite : « Le perfide a dit vrai. »",
'Sourate al-Ikhlâs':"« Dis : Il est Allah, l'Unique (al-Ikhlâs), et les deux sourates protectrices (al-Falaq et an-Nâs), le soir et le matin, trois fois : elles te suffiront contre toute chose. »",
'Sourate al-Falaq':"« Dis : Il est Allah, l'Unique (al-Ikhlâs), et les deux sourates protectrices (al-Falaq et an-Nâs), le soir et le matin, trois fois : elles te suffiront contre toute chose. »",

'Invocation du matin':"Ibn Mas'ûd rapporte que le Prophète ﷺ disait le soir : « Amsaynâ wa amsâ al-mulku lillâh… », et que le matin il disait la même chose en commençant par « Asbahnâ wa asbaha al-mulku lillâh ».",
'Invocation du soir':"Ibn Mas'ûd rapporte que le Prophète ﷺ disait le soir : « Amsaynâ wa amsâ al-mulku lillâh… », et que le matin il disait la même chose en commençant par « Asbahnâ wa asbaha al-mulku lillâh ».",
'Allâhumma bika asbahnâ':"Abû Hurayra rapporte que le Prophète ﷺ disait le matin : « Allâhumma bika asbahnâ… », et le soir : « Allâhumma bika amsaynâ… ».",
'Allâhumma bika amsaynâ':"Abû Hurayra rapporte que le Prophète ﷺ disait le matin : « Allâhumma bika asbahnâ… », et le soir : « Allâhumma bika amsaynâ… ».",
'Sayyid al-istighfâr':"« Le maître des demandes de pardon, c'est de dire : Allâhumma anta rabbî… Celui qui le dit dans la journée en y croyant fermement, et meurt ce jour-là avant le soir, fait partie des gens du Paradis. Et celui qui le dit la nuit en y croyant fermement, et meurt avant le matin, fait partie des gens du Paradis. »",

 tr:"Āmanar-rasūlu bimā unzila ilayhi min rabbihi wal-mu'minūn, kullun āmana billāhi wa malā'ikatihi wa kutubihi wa rusulih, lā nufarriqu bayna aḥadin min rusulih, wa qālū sami'nā wa aṭa'nā, ghufrānaka rabbanā wa ilaykal-maṣīr. Lā yukallifullāhu nafsan illā wus'ahā, lahā mā kasabat wa 'alayhā mak-tasabat, rabbanā lā tu'ākhidhnā in nasīnā aw akhṭa'nā, rabbanā wa lā taḥmil 'alaynā iṣran kamā ḥamaltahu 'alal-ladhīna min qablinā, rabbanā wa lā tuḥammilnā mā lā ṭāqata lanā bih, wa'fu 'annā waghfir lanā warḥamnā, anta mawlānā fanṣurnā 'alal-qawmil-kāfirīn.",
 fr:"Le Messager a cru en ce qui lui a été descendu de la part de son Seigneur, et les croyants aussi. Tous ont cru en Allah, en Ses anges, en Ses Livres et en Ses messagers ; nous ne faisons aucune différence entre Ses messagers. Et ils ont dit : « Nous avons entendu et obéi. Ton pardon, notre Seigneur ! C'est vers Toi qu'est le retour. » Allah n'impose à aucune âme une charge supérieure à sa capacité. Elle a le bien qu'elle a fait, et contre elle le mal qu'elle a fait. Notre Seigneur, ne nous châtie pas si nous oublions ou si nous nous trompons. Notre Seigneur, ne nous charge pas d'un fardeau comme Tu en as chargé ceux d'avant nous. Notre Seigneur, ne nous impose pas ce que nous ne pouvons pas supporter ; efface nos fautes, pardonne-nous et fais-nous miséricorde. Tu es notre Maître : donne-nous la victoire sur les peuples mécréants.",
 src:"Coran 2:285-286 · al-Bukhârî 5009 et Muslim 808, rapporté par Abû Mas'ûd al-Ansârî",
 h:"« Celui qui récite les deux derniers versets de la sourate al-Baqara pendant la nuit, ils lui suffisent. »"},
{w:'C',t:'Souffler dans les mains + les 3 Qul',n:3,how:"Joins tes mains, souffle légèrement dedans, récite al-Ikhlâs, al-Falaq et an-Nâs, puis passe tes mains sur tout ton corps en commençant par la tête, le visage et le devant du corps. Touche le compteur à chaque cycle : 3 cycles.",
 ar:Q.map(a=>a.ar).join('<br><br>'),tr:Q.map(a=>a.tr).join(' / '),fr:Q.map(a=>a.fr).join(' / '),src:"al-Bukhârî 5017, rapporté par 'Âïsha",
 h:"« Chaque nuit, lorsque le Prophète ﷺ se mettait au lit, il joignait ses paumes, soufflait dedans et y récitait : Qul huwa Allâhu ahad, Qul a'ûdhu bi-rabbil-falaq et Qul a'ûdhu bi-rabbin-nâs. Puis il passait ses mains sur tout ce qu'il pouvait atteindre de son corps, en commençant par la tête, le visage et le devant du corps. Il faisait cela trois fois. »"},

{w:'C',t:'Bismika rabbî wada\'tu janbî',n:1,ar:'بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ',

{w:'C',t:'Bismika Allâhumma amûtu wa ahyâ',n:1,ar:'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا',tr:"Bismika Allāhumma amūtu wa aḥyā.",fr:"C'est en Ton nom, ô Allah, que je meurs et que je vis.",src:"al-Bukhârî 6312, rapporté par Hudhayfa",

{w:'C',t:'Allâhumma aslamtu nafsî ilayk (en dernier)',n:1,ar:'اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ',
 tr:"Allāhumma aslamtu nafsī ilayk, wa fawwaḍtu amrī ilayk, wa wajjahtu wajhī ilayk, wa alja'tu ẓahrī ilayk, raghbatan wa rahbatan ilayk, lā malja'a wa lā manjā minka illā ilayk, āmantu bi-kitābikal-ladhī anzalt, wa bi-nabiyyikal-ladhī arsalt.",
 fr:"Ô Allah, je Te soumets mon âme, je Te confie mon affaire, je tourne mon visage vers Toi et je m'adosse à Toi, par désir de Toi et par crainte de Toi. Il n'y a ni refuge ni salut contre Toi, sauf auprès de Toi. Je crois en Ton Livre que Tu as descendu et en Ton Prophète que Tu as envoyé.",
 src:"al-Bukhârî 247 et Muslim 2710, rapporté par al-Barâ' ibn 'Âzib",

/* ---------- lecteur plein écran ---------- */
let tick=0;
function openPlayer(P){S.P=P;$('#player').classList.add('open');document.body.style.overflow='hidden';renderPlayer()}
function closePlayer(){clearInterval(tick);S.P=null;$('#player').classList.remove('open');$('#player').innerHTML='';document.body.style.overflow='';render()}
const fmtS=s=>Math.floor(s/60)+':'+pad(Math.max(0,s%60));
function parseEx(s){return(s.ex||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const pr=x.split(/\s[—–-]\s/),name=pr[0].trim(),det=(pr[1]||'').trim(),m=det.match(/^(\d+)\s*[x×]\s*(.+)$/);return{name,det,sets:m?+m[1]:1,reps:m?m[2]:det}})}
function renderPlayer(){const P=S.P;if(!P)return;const el=$('#player');
 if(P.type==='adh'){const L=P.list,it=L[P.i];
  if(P.done){el.innerHTML=`<div class="ptop"><h3>${P.title||'Adhkar du '+(P.w==='M'?'matin':'soir')}</h3><button class="pclose" data-act="pclose" aria-label="Fermer">×</button></div><div class="pbody"><h2>Bârak Allâhu fîk</h2><p class="sub">${P.title?P.title+' terminé':'Adhkar du '+(P.w==='M'?'matin':'soir')+' terminés'} et coché pour aujourd'hui.</p><button class="btn white" data-act="pclose">Fermer</button></div>`;return}
  const C=2*Math.PI*70,f=Math.min(1,P.c/it.n);
  el.innerHTML=`<div class="ptop"><h3>${P.title||'Adhkar du '+(P.w==='M'?'matin':'soir')}</h3><button class="pclose" data-act="pclose" aria-label="Fermer">×</button></div><div class="dots">${L.map((_,i)=>`<i class="${i<=P.i?'on':''}"></i>`).join('')}</div>
  <div class="pbody" style="justify-content:flex-start"><div class="sub">${P.i+1} / ${L.length} · ${esc(it.t)}</div>${it.how?`<div class="hd">${esc(it.how)}</div>`:''}<div class="ar">${it.ar}</div><div class="tr">${esc(it.tr)}</div><div class="fr">${esc(it.fr)}</div>${it.h?`<div class="hd">${esc(it.h)}</div>`:''}<div class="src">${esc(it.src)}</div>
  <button class="counter" data-act="pcount" aria-label="Compter"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" stroke="rgba(255,255,255,.18)"/><circle cx="75" cy="75" r="70" stroke="#fff" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" style="transition:stroke-dashoffset .25s"/></svg><b>${P.c}</b><span>sur ${it.n} · touche</span></button></div>
  <div class="src" style="text-align:center;margin-top:6px">Glisse vers la gauche pour passer à la suite, vers la droite pour revenir</div><div class="pbtns"><button class="btn line" data-act="pprev" ${P.i?'':'disabled'}>Précédent</button><button class="btn white" data-act="pnext">${P.i===L.length-1?'Terminer':'Suivant'}</button></div>`;return}
 const s=S.items.find(i=>i.id===P.sid),L=P.list,e=L[P.i];
 const top=`<div class="ptop"><h3>${esc(s?s.title:(P.quick?P.quick.title:'Séance'))}</h3><button class="pclose" data-act="pclose" aria-label="Fermer">×</button></div><div class="dots">${L.map((_,i)=>`<i class="${i<P.i||(i===P.i&&P.done)?'on':''}"></i>`).join('')}</div>`;
 if(P.done){el.innerHTML=top+`<div class="pbody"><h2>Séance terminée</h2><p class="sub">Elle est cochée pour aujourd'hui. Pense à t'étirer et à boire.</p><button class="btn white" data-act="pclose">Fermer</button></div>`;return}
 if(P.rest){const nx=P.set<=e.sets?e:L[P.i];el.innerHTML=top+`<div class="pbody timer"><div class="sub">Récupération</div><b id="tleft">${fmtS(Math.ceil((P.end-Date.now())/1000))}</b><div class="sub">Ensuite : ${esc(nx.name)} · série ${P.set}/${nx.sets}</div><div class="rests">${[45,60,90,120].map(x=>`<button class="${(S.restDur||90)===x?'on':''}" data-act="prest" data-x="${x}">${x} s</button>`).join('')}</div></div><div class="pbtns"><button class="btn line" data-act="padd">+15 s</button><button class="btn white" data-act="pskip">C'est reparti</button></div>`;return}
 el.innerHTML=top+`<div class="pbody"><div class="sub">Exercice ${P.i+1} / ${L.length}</div><h2>${esc(e.name)}</h2><div class="sub" style="font-size:20px">Série <b>${P.set}</b> / ${e.sets}${e.reps?' · '+esc(e.reps)+(/^\d+$/.test(e.reps)?' répétitions':''):''}</div><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.name+' exercice')}" target="_blank" rel="noopener">Voir la démo</a></div><div class="pbtns"><button class="btn line" data-act="pnextex">${P.i===L.length-1?'Finir':'Exercice suivant'}</button><button class="btn white" data-act="pset">Série faite</button></div>`}
function startRest(){const P=S.P;P.rest=true;P.end=Date.now()+(S.restDur||90)*1000;clearInterval(tick);tick=setInterval(()=>{if(!S.P||!S.P.rest){clearInterval(tick);return}const left=Math.ceil((S.P.end-Date.now())/1000);const t=$('#tleft');if(t)t.textContent=fmtS(left);if(left<=0){clearInterval(tick);beep();S.P.rest=false;renderPlayer()}},250);renderPlayer()}
function finishSess(){const P=S.P;P.done=true;P.rest=false;clearInterval(tick);const t=today(),ss=[...(dayOf(t).sess||[])];if(P.quick){const q=[...(dayOf(t).quick||[])];if(!q.includes(P.quick.id)){q.push(P.quick.id);setDay(t,{quick:q})}}else if(!ss.includes(P.sid)){ss.push(P.sid);setDay(t,{sess:ss})}renderPlayer();burst(center());beep()}
function finishAdh(){const P=S.P;P.done=true;if(P.act){const a=[...(dayOf(today()).acts||[])];if(!a.includes(P.act))a.push(P.act);setDay(today(),{acts:a})}else setDay(today(),{[{M:'adhM',S:'adhS',C:'adhC',P:'adhP'}[P.w]||'adhS']:true});renderPlayer();burst(center())}

function openForm(kind,obj){const sc=SCH[kind],p=prof();obj=obj||{};S.form={kind,obj:{...obj}};let h=`<h2>${obj.id?'Modifier':'Ajouter'} : ${sc.t}</h2><form id="frm" novalidate>`;
 for(const [k,l,t,o,req] of sc.f){const v=obj[k]??'';const L=esc(l)+(req?' *':'');
  if(t==='check')h+=`<label class="f ck"><input type="checkbox" name="${k}" ${v?'checked':''}>${L}</label>`;
  else if(t==='textarea')h+=`<label class="f">${L}<textarea name="${k}">${esc(v)}</textarea></label>`;
  else if(t==='select'||t==='course'){const opts=t==='course'?p.courses:o;h+=`<label class="f">${L}<select name="${k}">${req?'':'<option value=""></option>'}${opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}${v&&!opts.includes(v)?`<option selected>${esc(v)}</option>`:''}</select></label>`}
  else if(t==='days')h+=`<div class="f">${L}<div class="seg wrap" style="margin-top:6px">${DAYS.map(d=>`<button type="button" class="${(v||[]).includes(d)?'on':''}" data-day="${d}">${d}</button>`).join('')}</div></div>`;
  else h+=`<label class="f">${L}<input name="${k}" type="${t==='number'?'text':t}" ${t==='number'?'inputmode="decimal"':''} value="${esc(v)}"></label>`}
 if(obj.photo)h+=`<img src="${esc(obj.photo)}" alt="Photo du repas" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:12px">`;
 h+=`<div class="acts"><button class="btn" type="submit">Enregistrer</button>${obj.id?'<button type="button" class="btn ghost" id="fdel">Supprimer</button>':''}<button type="button" class="btn ghost" data-act="close">Fermer</button></div></form>`;
 $('#panel').innerHTML=h;$('#sheet').classList.add('open');
 $('#frm').onsubmit=e=>{e.preventDefault();const fm=e.target,o={...S.form.obj,kind};
  for(const [k,l,t,op,req] of sc.f){if(t==='check')o[k]=fm.elements[k].checked;else if(t==='days')o[k]=[...fm.querySelectorAll('[data-day].on')].map(b=>b.dataset.day);else{let v=fm.elements[k].value.trim();if(t==='number')v=v===''?'':Number(v.replace(',','.'))||0;o[k]=v}
   if(req&&(o[k]===''||(Array.isArray(o[k])&&!o[k].length))){toast('À remplir : '+l);return}}
  saveItem(o);closeSheet();toast('Enregistré')};
 const del=$('#fdel');if(del)del.onclick=()=>{if(del.dataset.c){closeSheet();delItem(obj.id)}else{del.dataset.c=1;del.textContent='Confirmer la suppression';del.style.color='var(--w)'}}}

const ACT={
 pg:(id,x)=>{if(S.pg)S.stack.push(S.pg);S.pg={n:x,a:id};S.pgNew=true;render()},
 back:()=>{S.pg=S.stack.pop()||null;render()},
 cstat:(id,x)=>{const o=S.items.find(i=>i.id===id);if(o&&o.status!==x){saveItem({...o,status:x});toast('Statut : '+x)}},
 tab:(id,x)=>{S.pg=null;S.stack=[];if(S.tab!==x)S.anim=true;S.tab=x;render();window.scrollTo(0,0)},
 goto:(id,x)=>{S.pg=null;S.stack=[];const [a,b]=x.split(':');S.tab=a;if(b)S.seg[a]=b;S.anim=true;render();window.scrollTo(0,0)},
 play:id=>{const s=S.items.find(i=>i.id===id);if(!s)return;const L=parseEx(s);if(!L.length){toast('Ajoute des exercices à cette séance');return}unlockAudio();openPlayer({type:'sess',sid:id,list:L,i:0,set:1,rest:false})},

 hab:(id,x,b)=>{const t=today(),s=[...(dayOf(t).hab||[])],i=s.indexOf(id);if(i>=0)s.splice(i,1);else{s.push(id);if(b)burst(b.getBoundingClientRect())}setDay(t,{hab:s})},
 act:(id,x,b)=>{const t=today(),s=[...(dayOf(t).acts||[])],i=s.indexOf(x);if(i>=0)s.splice(i,1);else{s.push(x);if(b)burst(b.getBoundingClientRect())}setDay(t,{acts:s})},
 quran:(id,x)=>{const t=today();setDay(t,{quran:Math.max(0,num(dayOf(t).quran)+num(x))})},
 dhikr:()=>openPlayer({type:'adh',w:'I',title:'Istighfar',act:'istighfar',list:[ISTI],i:0,c:0}),
 playToday:()=>{const t=today(),dw=dowOf(t),d=dayOf(t).sess||[];const s=items('session').filter(x=>DMAP[x.day]===dw&&x.type!=='Repos');const n=s.find(x=>!d.includes(x.id))||s[0];if(n)ACT.play(n.id)},
 adhkar:(id,x)=>openPlayer({type:'adh',w:x,title:ADH_T[x],list:ADH.filter(a=>a.w.includes(x)),i:0,c:0}),
 pclose:()=>closePlayer(),
 pset:()=>{unlockAudio();const P=S.P,e=P.list[P.i];if(P.set<e.sets){P.set++;startRest()}else if(P.i<P.list.length-1){P.i++;P.set=1;startRest()}else finishSess()},
 pnextex:()=>{const P=S.P;clearInterval(tick);P.rest=false;if(P.i<P.list.length-1){P.i++;P.set=1;renderPlayer()}else finishSess()},
 pskip:()=>{clearInterval(tick);S.P.rest=false;renderPlayer()},
 padd:()=>{S.P.end+=15000;const t=$('#tleft');if(t)t.textContent=fmtS(Math.ceil((S.P.end-Date.now())/1000))},
 prest:(id,x)=>{S.restDur=+x;if(S.P&&S.P.rest){S.P.end=Date.now()+S.restDur*1000;renderPlayer()}},
 pcount:(id,x,b)=>{const P=S.P,it=P.list[P.i];if(P.c>=it.n)return;P.c++;if(P.c>=it.n){burst(b.getBoundingClientRect());renderPlayer();setTimeout(()=>{if(S.P!==P||P.done)return;if(P.i<P.list.length-1){P.i++;P.c=0;renderPlayer();$('#player').scrollTo(0,0)}else finishAdh()},550)}else renderPlayer()},
 pnext:()=>{const P=S.P;if(P.i<P.list.length-1){P.i++;P.c=0;renderPlayer();$('#player').scrollTo(0,0)}else finishAdh()},
 pprev:()=>{const P=S.P;if(P.i>0){P.i--;P.c=0;renderPlayer();$('#player').scrollTo(0,0)}},
 seg:(id,x)=>{const [a,b]=x.split(':');S.seg[a]=b;render()},
 add:(id,x)=>{const t=today(),d={hw:{course:prof().courses[0]},event:{date:t},match:{date:t},meal:{date:t},contact:{status:'À contacter'},goal:{cat:'Foot'},session:{day:S.pg&&S.pg.n==='day'?S.pg.a:DAYS[(dowOf(t)+6)%7],type:'Salle'}}[x]||{};if(x==='hw'&&S.hwc!=='Tous')d.course=S.hwc;openForm(x,d)},
 edit:id=>{const o=S.items.find(i=>i.id===id);if(o)openForm(o.kind,o)},
 tog:(id,x,b)=>{const o=S.items.find(i=>i.id===id);if(!o)return;if(!o[x]&&b)burst(b.getBoundingClientRect());saveItem({...o,[x]:!o[x]})},
 pr:(id,x,b)=>{const [d,k]=x.split('|');const p={...(dayOf(d).prayers||{})};p[k]=!p[k];if(p[k]&&b)burst(b.getBoundingClientRect());setDay(d,{prayers:p});if(PR.every(([q])=>p[q]))toast('5 prières sur 5 aujourd\'hui. Série : '+streak()+' j')},
 adh:(id,x)=>{const t=today();setDay(t,{[x]:!dayOf(t)[x]})},

 sess:(id,x,b)=>{const t=today();const s=[...(dayOf(t).sess||[])];const i=s.indexOf(id);if(i>=0)s.splice(i,1);else{s.push(id);if(b)burst(b.getBoundingClientRect())}setDay(t,{sess:s})},

 export:()=>exportData(),

 mealphoto:()=>$('#fmeal').click(),
 cf:(id,x)=>{S.cf=x;render()},
 hwc:(id,x)=>{S.hwc=x;render()},

$('#attach').addEventListener('click',()=>{if(!S.aiImg){toast('Photos non disponibles pour l\'IA ici');return}$('#fchat').click()});
$('#fchat').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;S.pendImg=await shrink(f);const p=$('#pend');p.hidden=false;p.textContent='Photo prête à envoyer · toucher pour retirer';p.onclick=()=>{S.pendImg=null;p.hidden=true}});
function send(){const cin=$('#cin');const v=cin.value.trim();if(!v&&!S.pendImg)return;const img=S.pendImg;S.pendImg=null;$('#pend').hidden=true;cin.value='';cin.style.height='';ask(v||'Analyse cette photo et dis-moi ce qui est utile pour moi.',img)}
$('#send').addEventListener('click',send);
{const PL=$('#player');let sx=0,sy=0;PL.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});PL.addEventListener('touchend',e=>{if(!S.P||S.P.type!=='adh'||S.P.done)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.7)return;if(dx<0)ACT.pnext();else ACT.pprev()},{passive:true})}
{let tx=0,ty=0,src=null;const V=$('#view');
 V.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;src=e.target},{passive:true});
 const PG=$('#page');let px=0,py=0;PG.addEventListener('touchstart',e=>{const t=e.touches[0];px=t.clientX;py=t.clientY},{passive:true});PG.addEventListener('touchend',e=>{const t=e.changedTouches[0];if(t.clientX-px>90&&Math.abs(t.clientY-py)<50&&px<60)ACT.back()},{passive:true});
 V.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)<90||Math.abs(dy)>45||!src||src.closest('.seg,table,input,textarea,select'))return;const i=TABS.findIndex(x=>x[0]===S.tab),j=dx<0?i+1:i-1;if(j>=0&&j<TABS.length)ACT.tab('',TABS[j][0])},{passive:true})}

/* ---------- rendu ---------- */
const ICON={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',foot:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5l4 2.9-1.5 4.7h-5L8 10.4z"/><path d="M12 3v4.5M16 10.4l4.3-1.4M14.5 15.1l2.7 3.7M9.5 15.1l-2.7 3.7M8 10.4L3.7 9"/>',ecole:'<path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h12"/>',vie:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',ia:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'};
const TABS=[['home','Accueil'],['foot','Foot'],['ecole','École'],['vie','Islam'],['ia','Moi']];
function status(){if(S.fresh)return`<div class="card" style="margin-top:10px"><h2 style="margin:0 0 6px;font-size:26px">Bienvenue sur MG9</h2><p class="mute" style="margin:0 0 12px">Importe ta sauvegarde (le fichier mg9-sauvegarde.json) pour retrouver tes contacts, devoirs, objectifs et ton programme.</p><button class="cta" data-act="import">Importer ma sauvegarde</button></div>`;return''}
function render(){
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-x="${k}" aria-label="${l}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}</button>`).join('');
 $('#hdate').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
 document.body.classList.toggle('home',S.tab==='home');
 const v=$('#view');v.classList.toggle('anim',!!S.anim&&!RM.matches);S.anim=false;
 v.innerHTML=status()+({home:vHome,foot:vFoot,ecole:vEcole,vie:vIslam,ia:vMoi})[S.tab]();
 renderPage();
 $('#composer').classList.toggle('show',S.tab==='ia'&&!!S.ai&&!S.pg);
 $('#attach').style.display=S.aiImg?'':'none';
 animRings();
}
render();

/* ---------- stockage local (sur ton iPhone) ---------- */
function exportData(){const d=JSON.stringify({v:1,exported:new Date().toISOString(),items:S.items,days:S.days,profile:S.profile,bilan:S.bilan||null},null,1);const name='mg9-sauvegarde-'+today()+'.json';
 try{const f=new File([d],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Sauvegarde MG9'}).catch(()=>{});return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LSK)||'null');if(d&&Array.isArray(d.items)){S.items=d.items;S.days=d.days||{};S.profile=d.profile||{};S.bilan=d.bilan||null;return true}}catch(e){}return false}
S.loaded=true;S.fresh=!loadLocal();
if(!S.fresh&&!S.profile.habSeeded&&!S.items.some(i=>i.kind==='habit')){HAB_DEFAULT.forEach((t,i)=>S.items.push({id:'hab-'+i,kind:'habit',title:t}));S.profile={...S.profile,habSeeded:true};persist()}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
render();
}
</script>
