 ["Allah ordonne les ablutions avant la prière : laver le visage, les mains jusqu'aux coudes, passer les mains mouillées sur la tête et laver les pieds jusqu'aux chevilles.","Coran 5:6 (sens)"],
 ["Sans ablutions, la prière n'est pas acceptée.","« Allah n'accepte pas la prière de celui qui a perdu ses ablutions tant qu'il ne les a pas refaites. » al-Bukhârî 135, Muslim 225"],
 ["Les étapes : l'intention (dans le cœur), Bismillah, les mains 3 fois, la bouche et le nez 3 fois, le visage 3 fois, le bras droit puis le gauche jusqu'aux coudes 3 fois, la tête une fois (puis les oreilles), le pied droit puis le gauche jusqu'aux chevilles 3 fois.","Description de 'Uthmân ibn 'Affân : al-Bukhârî 159, Muslim 226 ; les oreilles : Abû Dâwûd et at-Tirmidhî"],
 ["Laver chaque partie une seule fois est valable. Trois fois, c'est la sunna. Le Prophète ﷺ les a faites une fois, deux fois et trois fois.","al-Bukhârî 157, 158 et 159"],
 ["La récompense : « Celui qui fait ses ablutions comme mes ablutions que voici, puis prie deux rak'a sans se laisser distraire, ses péchés passés lui sont pardonnés. »","al-Bukhârî 159, Muslim 226"],
 ["Après les ablutions : « Ash-hadu an lâ ilâha illa-llâhu wahdahu lâ sharîka lah, wa ash-hadu anna Muhammadan 'abduhu wa rasûluh. » Les huit portes du Paradis lui sont ouvertes, il entre par celle qu'il veut.","Muslim 234"],
 ["Ce qui annule les ablutions : faire ses besoins (urine, selles), les gaz, le sommeil profond, la perte de conscience. D'autres cas sont discutés entre les écoles : demande à un savant de confiance.","En cas de doute sur un gaz : « Qu'il ne quitte pas la prière tant qu'il n'a pas entendu un son ou senti une odeur. » al-Bukhârî 137, Muslim 361"]],
q:[["Que laves-tu juste avant les bras ?",["Le visage","Les pieds","La tête","Les oreilles"],"Mains, bouche et nez, visage, puis bras, tête, pieds (al-Bukhârî 159)."],
 ["Pendant la prière, tu doutes d'avoir perdu tes ablutions (gaz). Tu…",["Continues, sauf si tu as entendu un son ou senti une odeur","Arrêtes tout de suite","Recommences la prière","Fais 2 prosternations"],"La certitude ne s'annule pas par le doute (al-Bukhârî 137, Muslim 361)."],
 ["Combien de fois passe-t-on les mains sur la tête ?",["Une fois","Trois fois","Deux fois","Sept fois"],"La tête est essuyée une fois (al-Bukhârî 159)."],
 ["La récompense de l'invocation après les ablutions ?",["Les 8 portes du Paradis lui sont ouvertes","Ses ablutions durent 2 jours","Il n'a plus besoin de prier la sunna","Rien de précis"],"Muslim 234."]]},
{id:'i3',t:'La prière : conditions et piliers',s:'Ce qui la rend valable',p:[
 ["Avant de commencer : être en état de pureté, que l'heure soit entrée, être tourné vers la qibla, couvrir sa 'awra, et avoir l'intention.","Heures : Coran 4:103 (sens : « la prière est prescrite aux croyants à des moments déterminés ») ; qibla : Coran 2:144 ; intention : « Les actes ne valent que par les intentions » al-Bukhârî 1"],
 ["La règle de base : « Priez comme vous m'avez vu prier. »","al-Bukhârî 631"],
 ["Un homme priait vite. Le Prophète ﷺ lui a dit trois fois : « Retourne prier, car tu n'as pas prié », puis lui a appris : « Dis Allâhu akbar, récite ce qui t'est facile du Coran, incline-toi jusqu'à être immobile, redresse-toi jusqu'à être bien droit, prosterne-toi jusqu'à être immobile, relève-toi jusqu'à être immobile assis, et fais cela dans toute ta prière. »","al-Bukhârî 757, Muslim 397"],
 ["La Fâtiha est obligatoire dans chaque rak'a.","« Pas de prière pour celui qui ne récite pas la Fâtiha. » al-Bukhârî 756, Muslim 394"],
 ["Les piliers, selon la majorité des savants : le takbîr d'ouverture, rester debout (si on peut), la Fâtiha, l'inclinaison, se redresser, les deux prosternations, s'asseoir entre elles, le dernier tashahhud assis, le salâm, et le calme (tuma'nîna) dans chaque position. Les écoles les classent un peu différemment.","Synthèse des écoles (malikite, chafi'ite, hanafite, hanbalite)"],
 ["Elle commence par le takbîr et se termine par le salâm.","« La clé de la prière est la purification ; on y entre par le takbîr et on en sort par le taslîm. » Abû Dâwûd 61, at-Tirmidhî 3"],
 ["Tu ne sais plus si tu as prié 3 ou 4 rak'a ? Base-toi sur ce dont tu es sûr (le plus petit nombre), termine, puis fais deux prosternations de l'oubli avant le salâm.","« Si l'un de vous doute dans sa prière et ne sait pas s'il a prié trois ou quatre, qu'il écarte le doute, se base sur ce dont il est sûr, puis fasse deux prosternations avant le salâm. » Muslim 571"]],
q:[["Ce que le Prophète ﷺ a corrigé chez l'homme qui priait mal ?",["Le manque de calme dans chaque position","Sa tenue","Le choix des sourates","L'heure de sa prière"],"Il lui a appris à être immobile dans chaque position (al-Bukhârî 757, Muslim 397)."],
 ["Sans la Fâtiha, la prière est…",["Non valable","Valable mais moins récompensée","Valable si on récite une autre sourate","Valable pour la sunna"],"« Pas de prière pour celui qui ne récite pas la Fâtiha » (al-Bukhârî 756, Muslim 394)."],
 ["Tu doutes : 3 ou 4 rak'a ?",["Je retiens 3, je termine, puis 2 prosternations de l'oubli","Je retiens 4 et je termine","Je recommence toute la prière","Je continue sans rien faire"],"On se base sur la certitude (Muslim 571)."],
 ["Combien de prosternations dans chaque rak'a ?",["2","1","3","4"],"Deux prosternations, séparées par une position assise."]]},
{id:'i4',t:'Les 5 prières et leurs sunnas',s:'Rak\'a, horaires, rawâtib, witr',p:[
 ["Fajr 2 rak'a, Dhuhr 4, 'Asr 4, Maghrib 3, 'Ishâ' 4 : 17 rak'a obligatoires par jour.","Connu de façon certaine (transmission unanime)"],
 ["Les horaires : le Fajr de l'aube au lever du soleil ; le Dhuhr quand le soleil a passé le zénith ; le 'Asr tant que le soleil n'a pas jauni ; le Maghrib après le coucher, tant que la lueur rouge n'a pas disparu ; le 'Ishâ' jusqu'au milieu de la nuit.","Hadith de 'Abdullâh ibn 'Amr, Muslim 612"],
 ["Prier à l'heure fait partie des actes les plus aimés d'Allah.","« Quelle est l'action la plus aimée d'Allah ? — La prière à son heure. » al-Bukhârî 527, Muslim 85"],
 ["Les 12 rak'a sunna (rawâtib) : 2 avant le Fajr, 4 avant le Dhuhr et 2 après, 2 après le Maghrib, 2 après le 'Ishâ'.","« Celui qui prie douze rak'a dans la journée et la nuit, une maison lui est construite au Paradis. » Muslim 728 ; le détail : at-Tirmidhî 415"],
 ["Les 2 rak'a avant le Fajr valent plus que le monde entier.","« Les deux rak'a du Fajr sont meilleures que ce bas monde et ce qu'il contient. » Muslim 725"],
 ["Le witr (nombre impair de rak'a) termine la prière de la nuit, après le 'Ishâ'.","« Faites du witr la dernière de vos prières de la nuit. » al-Bukhârî 998, Muslim 751"],
 ["Le vendredi, la prière du Jumu'a remplace le Dhuhr pour les hommes.","Coran 62:9 (sens : « quand on appelle à la prière du vendredi, accourez à l'évocation d'Allah et laissez le commerce »)"]],
q:[["Combien de rak'a obligatoires par jour ?",["17","15","20","12"],"2 + 4 + 4 + 3 + 4 = 17."],
 ["Les 2 rak'a avant le Fajr valent…",["Mieux que ce bas monde et ce qu'il contient","Une prière obligatoire","Un jour de jeûne","Rien de précis"],"Muslim 725."],
 ["Combien de rak'a pour les rawâtib, chaque jour ?",["12","10","8","17"],"Muslim 728, détail chez at-Tirmidhî 415."],
 ["Le temps du 'Asr se termine…",["Avant que le soleil jaunisse (de préférence)","À midi","À minuit","Au lever du soleil"],"Muslim 612."]]},
{id:'i5',t:'Les prophètes : Âdam, Nûh, Ibrâhîm',s:'Histoires du Coran',p:[
 ["Allah a créé Âdam d'argile et a ordonné aux anges de se prosterner devant lui. Tous l'ont fait sauf Iblîs, par orgueil : « Je suis meilleur que lui, Tu m'as créé de feu et Tu l'as créé d'argile. »","Coran 7:11-12 et 38:71-76 (sens)"],
 ["Âdam et son épouse ont mangé de l'arbre interdit, trompés par Satan. Ils se sont repentis : « Rabbanâ zalamnâ anfusanâ, wa in lam taghfir lanâ wa tarhamnâ lanakûnanna mina-l-khâsirîn » (Seigneur, nous nous sommes fait du tort ; si Tu ne nous pardonnes pas et ne nous fais pas miséricorde, nous serons perdants). Leçon : l'erreur arrive, le repentir l'efface.","Coran 7:19-23 et 2:37"],
 ["Nûh a appelé son peuple pendant 950 ans, mais peu ont cru.","Coran 29:14 et 11:40"],
 ["Il a construit l'arche pendant qu'on se moquait de lui. Son propre fils a refusé de monter : « Je vais me réfugier sur une montagne qui me protégera de l'eau. » Leçon : la guidée vient d'Allah seul.","Coran 11:38 et 11:42-43 (sens)"],
 ["Ibrâhîm a brisé les idoles de son peuple. Ils l'ont jeté au feu, et Allah a dit : « Ô feu, sois fraîcheur et paix pour Ibrâhîm. »","Coran 21:57-69 (sens)"],
 ["Quand Allah lui a demandé de sacrifier son fils, celui-ci a répondu : « Ô mon père, fais ce qui t'est ordonné ; tu me trouveras, si Allah le veut, parmi les patients. » Allah l'a racheté par un sacrifice.","Coran 37:102-107 (sens)"],
 ["Ibrâhîm et son fils Ismâ'îl ont élevé les fondations de la Ka'ba. Allah a pris Ibrâhîm pour ami intime (khalîl).","Coran 2:127 et 4:125"]],
q:[["Pourquoi Iblîs a-t-il refusé de se prosterner ?",["Par orgueil","Par oubli","Il n'avait pas entendu l'ordre","Par peur"],"« Je suis meilleur que lui » (Coran 7:12)."],
 ["Combien de temps Nûh a-t-il appelé son peuple ?",["950 ans","40 ans","100 ans","500 ans"],"Coran 29:14."],
 ["Qu'a dit Allah au feu ?",["« Sois fraîcheur et paix pour Ibrâhîm »","« Éteins-toi »","« Brûle les idoles »","« Monte au ciel »"],"Coran 21:69."],
 ["Qui a élevé les fondations de la Ka'ba ?",["Ibrâhîm et Ismâ'îl","Âdam et Nûh","Mûsâ et Hârûn","Le Prophète Muhammad ﷺ seul"],"Coran 2:127."]]},
{id:'i6',t:'Les prophètes : Yûsuf, Mûsâ, Yûnus',s:'Patience, confiance, repentir',p:[
 ["Allah appelle l'histoire de Yûsuf « la plus belle des histoires ». Enfant, il voit en rêve onze étoiles, le soleil et la lune se prosterner devant lui.","Coran 12:3-4"],
 ["Jaloux, ses frères le jettent dans un puits. Son père Ya'qûb, en apprenant la nouvelle, dit : « Une belle patience ! » (fa-sabrun jamîl).","Coran 12:15-18"],
 ["Vendu en Égypte, Yûsuf résiste à la femme du ministre : « Seigneur, la prison m'est préférable à ce à quoi elles m'invitent. » Plus tard, il interprète le rêve du roi et devient responsable des réserves du pays.","Coran 12:23-33 et 12:43-55 (sens)"],
 ["Quand ses frères reviennent, il leur pardonne : « Pas de reproche contre vous aujourd'hui. Qu'Allah vous pardonne. »","Coran 12:92 (sens)"],
 ["Mûsâ, bébé, est mis dans le fleuve par sa mère sur l'ordre d'Allah, et grandit dans le palais de Pharaon. Plus tard, Allah lui parle dans la vallée de Tuwâ.","Coran 28:7-13 et 20:11-14"],
 ["Poursuivi par Pharaon, Mûsâ frappe la mer de son bâton et elle s'ouvre. Pharaon se noie et déclare croire au dernier moment, trop tard.","Coran 26:61-66 et 10:90-92"],
 ["Yûnus quitte son peuple en colère et se retrouve avalé par un énorme poisson. Dans les ténèbres, il invoque : « Lâ ilâha illâ anta, subhânaka, innî kuntu mina-z-zâlimîn » (pas de divinité à part Toi, gloire à Toi, j'étais parmi les injustes). Allah le sauve.","Coran 21:87-88. « Aucun musulman n'invoque par elle pour une chose sans qu'Allah lui réponde. » at-Tirmidhî 3505 (authentifié par al-Albânî)"]],
q:[["Qu'a dit Ya'qûb en perdant Yûsuf ?",["« Une belle patience ! »","« Vengeons-nous »","« C'est ma faute »","Rien"],"Coran 12:18."],
 ["Ce que Yûsuf a dit à ses frères à la fin :",["« Pas de reproche contre vous aujourd'hui »","« Partez d'ici »","« Je ne vous pardonnerai pas »","« Rendez-moi mes années »"],"Coran 12:92."],
 ["L'invocation de Yûnus dans le poisson commence par…",["Lâ ilâha illâ anta, subhânaka…","Rabbanâ âtinâ…","Hasbunallâh…","Bismillâh…"],"Coran 21:87."],
 ["Qu'est-il arrivé à la mer quand Mûsâ l'a frappée ?",["Elle s'est ouverte","Elle a gelé","Elle s'est asséchée pour toujours","Rien"],"Coran 26:63."]]},
{id:'i7',t:"'Îsâ et le Prophète Muhammad ﷺ",s:'Le Messie et le sceau des prophètes',p:[
 ["'Îsâ est né de Maryam sans père, par l'ordre d'Allah. « L'exemple de 'Îsâ auprès d'Allah est comme celui d'Âdam : Il l'a créé de terre, puis lui a dit « Sois », et il fut. »","Coran 3:59 et 19:16-22 (sens)"],
 ["Bébé, il parle dans le berceau : « Je suis le serviteur d'Allah. Il m'a donné le Livre et m'a fait prophète. » Il a fait des miracles par la permission d'Allah.","Coran 19:29-30 et 5:110 (sens)"],
 ["Il n'a été ni tué ni crucifié : Allah l'a élevé vers Lui. Il redescendra avant la fin des temps.","Coran 4:157-158 ; « Le fils de Maryam va bientôt descendre parmi vous comme juge équitable. » al-Bukhârî 2222, Muslim 155"],
 ["Muhammad ﷺ est né à La Mecque, vers l'an 570. Orphelin très jeune, il était connu comme « al-Amîn », le digne de confiance.","Sîra (biographie du Prophète ﷺ)"],
 ["À 40 ans, dans la grotte de Hirâ', l'ange Jibrîl lui apporte les premiers versets : « Lis, au nom de ton Seigneur qui a créé. »","Coran 96:1 ; récit complet : al-Bukhârî 3"],
 ["En 622, il émigre de La Mecque à Médine : c'est l'Hégire, le début du calendrier musulman. Il meurt en 632, à 63 ans.","al-Bukhârî 3536 (âge à sa mort)"],
 ["Il est le dernier des prophètes, et son caractère était le Coran.","Coran 33:40 (« le sceau des prophètes ») ; 'Â'isha : « Son caractère était le Coran. » Muslim 746"]],
q:[["Comment Allah décrit-Il la naissance de 'Îsâ ?",["Comme la création d'Âdam","Comme celle de Mûsâ","Comme celle de Yûsuf","Elle n'est pas décrite"],"Coran 3:59."],
 ["Les premiers mots révélés au Prophète ﷺ ?",["« Lis, au nom de ton Seigneur qui a créé »","« Au nom d'Allah, le Tout Miséricordieux »","« Dis : Il est Allah, Unique »","« Ô toi, l'enveloppé »"],"Coran 96:1, al-Bukhârî 3."],
 ["L'Hégire, c'est…",["L'émigration de La Mecque à Médine","Le pèlerinage","La première révélation","La conquête de La Mecque"],"En 622, début du calendrier musulman."],
 ["Que dit le Coran de la crucifixion de 'Îsâ ?",["Il n'a été ni tué ni crucifié","Il a été crucifié puis est revenu","Il est mort de vieillesse","Le Coran n'en parle pas"],"Coran 4:157-158."]]},
{id:'i8',t:'Petits actes, grandes récompenses',s:'Faciles à faire chaque jour',p:[
 ["Le sourire est une aumône.","« Ton sourire à ton frère est une aumône. » at-Tirmidhî 1956"],
 ["Deux phrases légères à dire, lourdes dans la balance.","« Deux paroles légères sur la langue, lourdes dans la balance, aimées du Tout Miséricordieux : Subhâna-llâhi wa bihamdih, Subhâna-llâhi-l-'azîm. » al-Bukhârî 6406, Muslim 2694"],
 ["Dire le salâm à ceux qu'on connaît et à ceux qu'on ne connaît pas fait naître l'amour entre les gens.","« … Voulez-vous que je vous indique une chose qui, si vous la faites, vous fera vous aimer ? Répandez le salâm entre vous. » Muslim 54"],
 ["Avant de manger : Bismillah, manger de la main droite et dans ce qui est devant soi.","« Ô garçon, dis Bismillah, mange de ta main droite et mange de ce qui est devant toi. » al-Bukhârî 5376, Muslim 2022"],
 ["Enlever un obstacle du chemin fait partie de la foi.","« La foi comporte soixante-dix et quelques branches… la plus petite est d'écarter ce qui gêne du chemin, et la pudeur est une branche de la foi. » Muslim 35"],
 ["Celui qui montre un bien à quelqu'un a la même récompense que celui qui le fait.","« Celui qui indique un bien a la même récompense que celui qui le fait. » Muslim 1893"],
 ["Le bon comportement envers les parents : ne même pas leur dire « ouf ».","Coran 17:23 (sens : « ne leur dis pas ‹ ouf ›, ne les brusque pas, et adresse-leur des paroles respectueuses »)"]],
q:[["Les deux paroles légères et lourdes dans la balance ?",["Subhâna-llâhi wa bihamdih, Subhâna-llâhi-l-'azîm","Allâhu akbar, Allâhu akbar","Astaghfirullâh, Astaghfirullâh","Bismillâh, al-hamdulillâh"],"al-Bukhârî 6406, Muslim 2694."],
 ["Ce qui fait naître l'amour entre les gens, selon le hadith :",["Répandre le salâm","Faire des cadeaux chers","Parler beaucoup","Rester entre amis"],"Muslim 54."],
 ["La plus petite branche de la foi ?",["Écarter ce qui gêne du chemin","Faire la prière","Jeûner","Lire le Coran"],"Muslim 35."]]},
{id:'i9',t:'Le jeûne',s:'Ramadan et jeûnes sunna',p:[
 ["Le jeûne du Ramadan est prescrit aux croyants pour atteindre la piété (taqwâ).","Coran 2:183 (sens)"],
 ["« Celui qui jeûne le Ramadan avec foi et en espérant la récompense d'Allah, ses péchés passés lui sont pardonnés. »","al-Bukhârî 38, Muslim 760"],
 ["Le sahûr (repas avant l'aube) est béni, même une gorgée d'eau.","« Prenez le sahûr, car il y a dans le sahûr une bénédiction. » al-Bukhârî 1923, Muslim 1095"],
 ["Rompre le jeûne dès le coucher du soleil, sans traîner.","« Les gens resteront dans le bien tant qu'ils se hâteront de rompre le jeûne. » al-Bukhârî 1957, Muslim 1098"],
 ["Tu as mangé ou bu par oubli ? Ton jeûne reste valable : continue-le.","« Celui qui oublie qu'il jeûne et mange ou boit, qu'il complète son jeûne : c'est Allah qui l'a nourri et abreuvé. » al-Bukhârî 1933, Muslim 1155"],
 ["Le lundi et le jeudi sont des jours de jeûne sunna.","« Les actes sont présentés le lundi et le jeudi, et j'aime que mon acte soit présenté alors que je jeûne. » at-Tirmidhî 747"],
 ["Le jour de 'Arafa et le jour de 'Âshûrâ' ont une grande récompense.","« Le jeûne du jour de 'Arafa : j'espère d'Allah qu'il expie l'année précédente et l'année suivante. Le jeûne de 'Âshûrâ' : j'espère qu'il expie l'année précédente. » Muslim 1162"]],
q:[["Tu bois par oubli pendant que tu jeûnes. Ton jeûne…",["Reste valable, tu continues","Est annulé","Doit être rattrapé deux fois","Est valable seulement si tu craches"],"al-Bukhârî 1933, Muslim 1155."],
 ["Le sahûr, c'est…",["Le repas avant l'aube","Le repas de rupture","La prière de la nuit","L'aumône du Ramadan"],"al-Bukhârî 1923, Muslim 1095."],
 ["Pourquoi jeûner le lundi et le jeudi ?",["Les actes sont présentés ces jours-là","C'est obligatoire","Pour rattraper le Ramadan seulement","Pour la santé"],"at-Tirmidhî 747."]]},
{id:'i10',t:'Le comportement du musulman',s:'Caractère, langue, amis, pudeur',p:[
 ["Le bon caractère est ce qu'il y a de plus lourd dans la balance.","« Rien n'est plus lourd dans la balance du croyant, le Jour de la Résurrection, qu'un bon caractère. » at-Tirmidhî 2002"],
 ["Se maîtriser quand on est en colère, c'est ça la vraie force.","« Le fort n'est pas celui qui terrasse les gens, le fort est celui qui se maîtrise quand il est en colère. » al-Bukhârî 6114, Muslim 2609"],
 ["Dire la vérité, même quand c'est dur.","« La véracité mène à la bonté, et la bonté mène au Paradis… le mensonge mène à la perversité, et la perversité mène au Feu. » al-Bukhârî 6094, Muslim 2607"],
 ["Tenir ses promesses et ce qu'on nous confie.","« Les signes de l'hypocrite sont trois : quand il parle, il ment ; quand il promet, il ne tient pas ; quand on lui confie quelque chose, il trahit. » al-Bukhârî 33, Muslim 59"],
 ["Bien choisir ses amis, car on finit par leur ressembler.","« L'homme suit la religion de son ami proche : que chacun de vous regarde donc qui il prend pour ami. » Abû Dâwûd 4833, at-Tirmidhî 2378"],
 ["Baisser le regard et préserver sa pudeur : c'est plus pur.","Coran 24:30 (sens : « dis aux croyants de baisser leurs regards et de préserver leur chasteté ; c'est plus pur pour eux »)"],
 ["Être bon avec les voisins.","« Celui qui croit en Allah et au Jour dernier, qu'il honore son voisin. » al-Bukhârî 6019, Muslim 47"]],
q:[["La vraie force, selon le hadith ?",["Se maîtriser dans la colère","Gagner les bagarres","Ne jamais parler","Être le plus musclé"],"al-Bukhârî 6114, Muslim 2609."],
 ["Un signe de l'hypocrite ?",["Ne pas tenir ses promesses","Prier en retard une fois","Avoir peu d'amis","Être timide"],"al-Bukhârî 33, Muslim 59."],
 ["Ce qui est le plus lourd dans la balance ?",["Le bon caractère","Les longues prières seulement","La richesse","Le nombre d'amis"],"at-Tirmidhî 2002."]]}];
const islDone=()=>prof().islDone||[];
function startIsl(id){const m=ISL.find(x=>x.id===id);if(!m)return;const steps=[...m.p.map((c,i)=>({k:'card',kick:'Point '+(i+1)+'/'+m.p.length,t:m.t,x:c[0],src:c[1]})),...m.q.map(q=>mcq(q[0],q[1],q[2]))];openPlayer({type:'learn',mode:'isl',mid:id,title:m.t,steps,i:0,score:0,nq:m.q.length})}
function islRows(){const d=islDone();return ISL.map(m=>{const ok=d.includes(m.id);return lr(`<span class="pdot${ok?' on':''}">${ok?I.check:''}</span>`,esc(m.t),esc(m.s)+(ok?' · validé':''),I.chev,['isl',m.id])}).join('')}
function islSection(){const d=islDone().length,nx=ISL.find(m=>!islDone().includes(m.id))||ISL[0];return sect("Apprendre l'islam",`<span class="mute">${d}/${ISL.length}</span>`)+`<div class="card"><div class="kick">${d?'Prochain module':'Commence ici'}</div><h3 class="h3b" style="font-size:24px">${esc(nx.t)}</h3><p class="mute" style="margin:0 0 10px">Cartes à lire, chacune avec sa source, puis un petit quiz.</p><button class="cta" data-act="isl" data-x="${nx.id}">${I.play} ${d?'Continuer':'Commencer'}</button></div><div class="card list">${islRows()}</div>`}
Object.assign(PAGES,{islearn:{t:"Apprendre l'islam",f:()=>`<div class="card list">${islRows()}</div>`}});

const ip2n=a=>a.split('.').reduce((n,x)=>n*256+ +x,0),n2ip=n=>[24,16,8,0].map(s=>Math.floor(n/2**s)%256).join('.');
const maskOf=p=>n2ip(2**32-2**(32-p));
function opts4(ans,cands){const s=[String(ans)];for(const c of cands){const v=String(c);if(!s.includes(v))s.push(v);if(s.length===4)break}return s}
function canon(s){s=String(s).trim().toLowerCase().replace(/^sudo\s+/,'').replace(/["']/g,'').replace(/\s+/g,' ');const out=[];let fl='';for(const t of s.split(' ')){if(/^-[a-z]+$/.test(t)&&t.length<=6)fl+=t.slice(1);else{if(fl){out.push('-'+[...new Set(fl)].sort().join(''));fl=''}out.push(t)}}if(fl)out.push('-'+[...new Set(fl)].sort().join(''));return out.join(' ')}
const typeStep=(q,acc,show,expl,o={})=>({k:'type',q,acc:acc.map(canon),show,expl,...o});
const orderStep=(sent,fr)=>{const w=sent.split(' ');let sh=shuffle([...w]);for(let k=0;k<5&&sh.join(' ')===sent;k++)sh=shuffle([...w]);return{k:'order',words:sh,ans:sent,fr,built:[]}};
const matchStep=(pairs,q)=>({k:'match',q,pairs,right:shuffle(pairs.map(p=>p[1])),ok:[],err:0,sel:null});

const engChoose=j=>{const e=ENG[j];return{...mcq('Quelle phrase est correcte ?',[e[1],e[0]],e[2]),eid:j,rc:e[1]}};
const SPOTS=(()=>{const r=[];ENG.forEach((e,j)=>{const b=e[0].split(' '),g=e[1].split(' ');if(b.length!==g.length)return;const d=b.map((w,i)=>w!==g[i]?i:-1).filter(i=>i>=0);if(d.length===1)r.push([j,d[0]])});return r})();
function engSpot(){if(!SPOTS.length)return engChoose(rnd(0,ENG.length-1));const [j,i]=pick(SPOTS),e=ENG[j],w=e[0].split(' '),others=shuffle(w.filter((x,k)=>k!==i&&x.replace(/\W/g,'').length>1&&x!==w[i]));return{...mcq(`Trouve le mot faux : « ${e[0]} »`,opts4(w[i],others),`Correct : « ${e[1]} ». ${e[2]}`),eid:j,rc:e[1]}}
const engFill=f=>({...mcq('Complète : '+f[0],[f[1],...f[2]],f[3]),rc:f[0].replace('___',f[1])});
const engTrad=t=>({...mcq(`Traduis : « ${t[0]} »`,t[1],t[2]),rc:t[1][0]});
function engMix(){const w=(prof().engWrong||[]).filter(j=>ENG[j]).slice(0,2),steps=[];const ids=[...w];while(ids.length<2){const j=rnd(0,ENG.length-1);if(!ids.includes(j))ids.push(j)}
 ids.forEach(j=>steps.push(engChoose(j)));steps.push(engSpot());sample(FILL,2).forEach(f=>steps.push(engFill(f)));steps.push(engTrad(pick(TRAD)));
 const o=pick(ORDER);steps.push(orderStep(o[0],o[1]));steps.push(matchStep(sample(VOC,4),'Relie le français et l\'anglais'));return shuffle(steps)}
const engFast=()=>pick([()=>engChoose(rnd(0,ENG.length-1)),()=>engFill(pick(FILL)),()=>engTrad(pick(TRAD)),()=>engSpot()])();

function subnetQ(asType){const p=pick([30,29,28,27,26,25,24,23,22,20,16]),b=pick([[192,168],[10,rnd(0,255)],[172,rnd(16,31)]]),ipn=ip2n([...b,rnd(0,255),rnd(1,254)].join('.')),size=2**(32-p),net=Math.floor(ipn/size)*size,bc=net+size-1,ip=n2ip(ipn),hosts=size-2;
 const t=asType?pick(['hosts','net']):pick(['mask','hosts','net','bc','same']);
 if(t==='mask')return mcq(`Quel est le masque d'un /${p} ?`,opts4(maskOf(p),[maskOf(Math.min(30,p+1)),maskOf(p-1),maskOf(Math.min(30,p+2)),maskOf(p-2)]),`/${p} = ${p} bits à 1, soit ${maskOf(p)}.`);
 if(t==='hosts'){const ex=`2^${32-p} = ${size} adresses, moins l'adresse réseau et le broadcast = ${hosts}.`;return asType?typeStep(`Combien d'adresses utilisables dans un /${p} ?`,[String(hosts)],String(hosts),ex,{num:1,kick:'Tape ta réponse'}):mcq(`Combien d'adresses utilisables dans un /${p} ?`,opts4(hosts,[size,2**(31-p)-2,2**(33-p)-2,hosts-1]),ex)}
 const ex=`/${p} = blocs de ${size} adresses. ${ip} tombe dans le bloc ${n2ip(net)} → ${n2ip(bc)}.`;
 if(t==='net')return asType?typeStep(`${ip}/${p} : quelle est l'adresse réseau ?`,[n2ip(net)],n2ip(net),ex,{kick:'Tape ta réponse'}):mcq(`${ip}/${p} : quelle est l'adresse réseau ?`,opts4(n2ip(net),[n2ip(bc),n2ip(Math.floor(ipn/256)*256),n2ip(net+size),n2ip(Math.max(0,net-size)),n2ip(net+1)]),ex);
 if(t==='bc')return mcq(`${ip}/${p} : quelle est l'adresse de broadcast ?`,opts4(n2ip(bc),[n2ip(net),n2ip(bc+size),n2ip(Math.floor(ipn/256)*256+255),n2ip(bc-1)]),ex);
 const same=Math.random()<.5,oth=same?net+rnd(1,Math.max(1,size-2)):(net+size+rnd(1,Math.max(1,size-2))),o2=n2ip(oth);
 return mcq(`${ip}/${p} et ${o2}/${p} sont-elles dans le même réseau ?`,same?['Oui','Non']:['Non','Oui'],`${ip} est dans ${n2ip(net)}/${p}. ${o2} est dans ${n2ip(Math.floor(oth/size)*size)}/${p}.`)}
function portQ(){const [s,n]=pick(PORTS);return Math.random()<.5?mcq(`Quel port utilise ${s} ?`,opts4(n,shuffle(PORTS.filter(x=>x[1]!==n)).map(x=>x[1])),`${s} = ${n}.`):mcq(`Le port ${n}, c'est…`,opts4(s,shuffle(PORTS.filter(x=>x[0]!==s)).map(x=>x[0])),`${n} = ${s}.`)}
function osiQ(){const [x,l]=pick(OSI);return mcq(`À quelle couche OSI se trouve : ${x} ?`,opts4(OSIN[l],shuffle([1,2,3,4,7].filter(k=>k!==l)).map(k=>OSIN[k])),`${x} → couche ${OSIN[l]}.`)}
function binQ(){const v=pick([128,192,224,240,248,252,254,255,10,172,168,64,100,200,1,127]),b=v.toString(2).padStart(8,'0'),flip=i=>b.slice(0,i)+(b[i]==='1'?'0':'1')+b.slice(i+1);
 return Math.random()<.5?mcq(`${v} en binaire (8 bits) ?`,opts4(b,[flip(rnd(0,3)),flip(rnd(4,7)),flip(rnd(0,7)),b.split('').reverse().join('')]),`${v} = ${b}. Poids des bits : 128 64 32 16 8 4 2 1.`):typeStep(`Convertis ${b} en décimal.`,[String(v)],String(v),`128 64 32 16 8 4 2 1 : additionne les bits à 1 → ${v}.`,{num:1,kick:'Tape ta réponse'})}
function cmdQ(){const c=pick(CMDS);return typeStep(c[0],c[1],c[2],'Accepté aussi : '+c[1].slice(0,3).join(' · '),{term:1,hint:c[2].split(' ')[0]+' …'})}
const scenQ=()=>{const s=pick(SCEN);return mcq(s[0],s[1],s[2])};
const portMatch=()=>{const L=sample(PORTS,4);return matchStep(L.map(x=>[x[0],String(x[1])]),'Relie chaque service à son port')};
function sysMix(){return shuffle([subnetQ(),subnetQ(true),portMatch(),portQ(),cmdQ(),cmdQ(),scenQ(),pick([osiQ,binQ])()])}
const sysFast=()=>pick([()=>subnetQ(),portQ,osiQ,()=>{const q=binQ();return q.k==='mcq'?q:portQ()},scenQ])();

function startSys2(speed){if(speed){const P={type:'learn',mode:'sys2',speed:1,gen:sysFast,title:'Défi 60 secondes',steps:[sysFast()],i:0,score:0,nq:0,end:Date.now()+60000};openPlayer(P);speedTick(P)}else openPlayer({type:'learn',mode:'sys2',title:'Admin sys · défi du jour',steps:sysMix(),i:0,score:0,nq:8})}

 if(st.k==='match')return`<div class="pbody" style="justify-content:flex-start"><div class="sub">${esc(st.q)}</div><div class="mgrid"><div>${st.pairs.map((p,i)=>`<button class="${st.ok.includes(i)?'ok':''}${st.sel===i?' sel':''}" data-act="lml" data-x="${i}" ${st.ok.includes(i)?'disabled':''}>${esc(p[0])}</button>`).join('')}</div><div>${(st.done?st.pairs.map(p=>p[1]):st.right).map((r,j)=>{const m=st.ok.some(i=>st.pairs[i][1]===r);return`<button class="${m?'ok':''}${st.flash===j?' ko':''}" data-act="lmr" data-x="${j}" ${m?'disabled':''}>${esc(r)}</button>`}).join('')}</div></div>${st.done?`<div class="hd"><b>${st.err<=1?'Bien joué !':'Terminé.'}</b> ${st.err} erreur${st.err>1?'s':''}.</div>`:'<p class="sub">Touche à gauche, puis la bonne réponse à droite.</p>'}</div>`;
 return''}
const answered=st=>st.k==='mcq'?st.picked!=null:['order','type','match'].includes(st.k)?!!st.done:true;

const _fl10=finishLearn;finishLearn=function(){const P=S.P;if(!P||!['eng2','sys2','isl'].includes(P.mode))return _fl10();
 P.done=true;const t=today();if(P.speed)P.nq=Math.max(P.nq,P.steps.filter(answered).length);
 P.gain=P.mode==='isl'?P.score*10+20:P.speed?Math.min(60,P.score*2):P.score*8+15;addXP(P.gain);
 if(P.mode==='eng2'){setDay(t,{engDone:true});const w=new Set(prof().engWrong||[]);P.steps.forEach(s=>{if(s.eid==null||!answered(s))return;if(stepRight(s))w.delete(s.eid);else w.add(s.eid)});saveProfile({engWrong:[...w].slice(-30)})}
 if(P.mode==='sys2')setDay(t,{sysDay:true});
 if(P.mode==='isl'&&P.nq&&P.score/P.nq>=0.66&&!islDone().includes(P.mid))saveProfile({islDone:[...islDone(),P.mid]});
 P.recap=P.steps.filter(s=>answered(s)&&!stepRight(s)).map(s=>s.rc||s.ans||s.show).filter(Boolean).slice(0,6);
 if(P.speed){const k=P.mode==='eng2'?'eng':'sys',b=prof().best||{};P.rec=P.score>(b[k]||0);P.best=Math.max(P.score,b[k]||0);if(P.rec)saveProfile({best:{...b,[k]:P.score}})}
 renderPlayer();burst(center())};
const _ln10=learnNext;learnNext=function(){const P=S.P;if(P&&P.type==='learn'){const st=P.steps[P.i];if(!answered(st)){toast("Réponds d'abord");return}if(P.speed&&P.i===P.steps.length-1){if(Date.now()<P.end){P.steps.push(P.gen());P.i++;P.picked=null;renderPlayer();return}P.nq=P.steps.filter(answered).length;return finishLearn()}}return _ln10()};
